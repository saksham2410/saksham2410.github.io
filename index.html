<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Saksham Gupta — Software Engineer at Google. IIT Jodhpur CSE '20. Terminal-style portfolio.">
    <title>Saksham Gupta — Software Engineer @ Google</title>
    <link rel="icon" href="./img/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="./css/main.css" rel="stylesheet" type="text/css">
    <script src="./js/polyfills.js"></script>
    <script src="./js/main.js"></script>
</head>
<body>
    <div id="sidenav">
        <button id="sidenavBtn">&#9776;</button>
        <img id="profilePic" alt="Saksham Gupta" src="./img/avatar.png">
    </div>
    <div id="container">
        <div id="output"></div>
        <div id="input-line" class="input-line">
            <div id="prompt" class="prompt-color"></div>&nbsp;
            <div>
                <input type="text" id="cmdline" autocomplete="off" autocorrect="off"
                    autocapitalize="off" spellcheck="false" autofocus
                    placeholder="type 'help' for commands...">
            </div>
        </div>
    </div>
    <div id="statusBar">
        <span><span class="status-dot"></span> saksham.me — visitor session</span>
        <span id="statusTime"></span>
    </div>
    <a id="githubImg" target="_blank" href="https://github.com/saksham2410/saksham2410.github.io"></a>
</body>
</html>
